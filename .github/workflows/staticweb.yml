name: Deploy to Cloudflare Pages

on:
  schedule:
    - cron: "0 3 * * *"
  push:
    branches:
      - main
    paths:
      - "packages/**"
      - "scripts/generate_staticweb.py"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Checkout web repo
        uses: actions/checkout@v4
        with:
          repository: biolds/statichub-web
          path: web-repo

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install web dependencies
        run: npm ci
        working-directory: web-repo

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Generate staticweb.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_staticweb.py

      - name: Prepare Cloudflare Pages deploy directory
        run: |
          mkdir -p /tmp/cloudflare-pages-deploy/node_modules/marked
          cp web-repo/index.html web-repo/styles.css web-repo/app.js web-repo/icon.svg /tmp/cloudflare-pages-deploy/
          cp staticweb.json /tmp/cloudflare-pages-deploy/
          cp web-repo/node_modules/marked/marked.min.js /tmp/cloudflare-pages-deploy/node_modules/marked/

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy /tmp/cloudflare-pages-deploy --project-name=statichub-pkg --commit-hash=${{ github.sha }}
